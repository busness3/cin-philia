# =============================================================================
# Identité TikTok globale — compte « petit boucan ».
# Ce fichier est LE document de direction artistique du compte : palette,
# typo, style des sous-titres, gabarit de couverture, timing d'ouverture/
# sortie. Une série (configs/series/*.yaml) ne surcharge QUE sa couleur
# d'accent + des métadonnées de production — tout le reste ici est commun à
# toutes les vidéos, quelle que soit la série.
#
# Miroir du document de référence DA « petit boucan » (v1).
# =============================================================================

identite:
  nom_compte: "petit boucan"
  bio: "23 ans — étudiante en médecine — je vis entre Dakar et Paris"

  watermark:
    actif: false   # pas de logo/tampon sur cette DA (doc §4)

  couleurs_marque:
    creme: "#F5EFE6"      # fond, bandeaux, voile des sous-titres
    chocolat: "#4A3328"   # texte, tout élément "sombre" (le noir pur est interdit)

video:
  largeur: 1080
  hauteur: 1920
  fps: 30
  codec_video: libx264
  crf: 18
  preset: medium
  codec_audio: aac
  bitrate_audio: 192k
  zone_sure:
    haut_px: 220
    bas_px: 480     # l'UI TikTok recouvre les ~480 derniers pixels
    lateral_px: 40

fonts:
  titre:
    police: ArchivoNarrow-SemiBold   # assets/fonts/ArchivoNarrow-SemiBold.ttf
    taille_px: 96
    interligne_px: 104
  sous_titre:
    police: Archivo-Medium           # assets/fonts/Archivo-Medium.ttf
    taille_px: 64

sous_titres:
  police: Archivo-Medium
  taille_px: 64
  couleur_texte: "#4A3328"
  couleur_contour: "#F5EFE6"   # contour crème : lisibilité directement sur l'image, pas de fond
  epaisseur_contour: 3
  baseline_y_px: 1250
  max_lignes: 2
  mode_groupement: segments   # phrases naturelles (whisper) — pas de légendes punchy
  mots_par_groupe: 6          # utilisé seulement si mode_groupement = groupes_mots

couverture:
  bandeau:
    x: 0
    y: 1140
    largeur: 1080
    hauteur: 360
    couleur_fond: "#F5EFE6"
  bloc_accent:
    x: 72
    y: 1200
    largeur: 18
    hauteur: 120
  titre:
    x: 138
    baseline_ligne1_y: 1260
    baseline_ligne2_y: 1364
    largeur_max_px: 870
    max_lignes: 2
    max_mots: 4
    couleur_texte: "#4A3328"

timing:
  titre_apparition_s: 0.3
  titre_duree_s: 2.0
  sortie_duree_s: 2.0
  musique_apres_voix: true
  sortie_activee: true   # à tester avant généralisation (doc §7) — désactivable facilement

rythme:
  transition_defaut: cut   # pas de rythme différencié par série dans cette DA
  duree_transition_ms: 200

audio:
  loudness_cible_lufs: -14.0
  musique:
    volume_defaut_db: -18
    ducking_sous_voix_db: -12
  sfx:
    volume_defaut_db: -6
