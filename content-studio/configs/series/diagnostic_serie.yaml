# =============================================================================
# Diagnostic Série — analyse/critique rapide d'une série TV.
# Hérite intégralement de configs/global.yaml (palette, typo, sous-titres,
# gabarit de couverture, timing) : cette config ne définit QUE l'accent et
# des métadonnées de production (doc DA §11). Rien d'autre n'est surchargeable.
# =============================================================================

nom: "Diagnostic Série"
description: "Analyse/critique rapide d'une série (points forts, points faibles, verdict)."

accent: "#D42A2A"   # rouge franc (doc DA §2)

# Métadonnées de production — informatives, à ajuster librement.
tenue: "Look simple, cohérent avec l'identité du compte (pas de blouse/stéthoscope, ça c'est resté à la fac)."
decor: "Intérieur neutre, même type de cadrage que les autres séries."
structure_script: "Accroche -> contexte rapide -> points forts -> points faibles -> verdict."
duree_cible_s: 60
cta_sortie: "Ton avis en commentaire ?"
formule_titre: "Nom de la série + verdict en 4 mots max (ex: \"[Série] : ça vaut le coup ?\")."

audio:
  mood_musique: energique
  volume_musique_db: -20
  sfx_transition: null
