# =============================================================================
# "Je lis je regarde je vous en parle" — livres/films/séries, ton posé.
# Hérite intégralement de configs/global.yaml. Cette config ne définit QUE
# l'accent et des métadonnées de production (doc DA §11).
#
# Accent : le document de DA globale ne couvrait que 3 séries au moment de sa
# rédaction (§2 : "séries à venir -> à définir"). Celui-ci est un choix par
# défaut qui respecte les règles de la section 2 (famille chaude, brique/
# prune, distinct du chocolat et des 3 autres accents) — à valider/ajuster
# librement.
# =============================================================================

nom: "Je lis je regarde je vous en parle"
description: "Retour sur un livre/film/série : ce que j'en ai pensé."

accent: "#8C4A3E"   # brique — chaud, distinct des 3 autres accents et du chocolat

tenue: "Tenue du quotidien."
decor: "Intérieur cosy — coin lecture/canapé par exemple."
structure_script: "Accroche -> de quoi ça parle (sans trop spoiler) -> ce que j'en ai pensé -> je recommande ou pas."
duree_cible_s: 60
cta_sortie: "Vous l'avez lu/vu ? Dites-moi en commentaire."
formule_titre: "Titre de l'œuvre + avis en 4 mots max (ex: \"[Titre] : mon vrai avis\")."

audio:
  mood_musique: calme
  volume_musique_db: -22
  sfx_transition: null
