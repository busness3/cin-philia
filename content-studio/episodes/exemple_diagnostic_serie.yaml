# =============================================================================
# Exemple d'épisode — sert de gabarit à copier pour chaque nouvelle vidéo.
# Un épisode = quelle série + quels rushs, dans quel ordre, avec quelles
# accroches/overlays/sfx spécifiques à CETTE vidéo (la direction artistique,
# elle, vient entièrement de configs/series/<serie>.yaml).
#
# Pour rendre cet épisode une fois les rushs en place :
#   python -m content_studio.cli render episodes/exemple_diagnostic_serie.yaml
# =============================================================================

serie: diagnostic_serie
titre_episode: "Diagnostic : [nom de la série]"
sortie: out/diagnostic_exemple.mp4

# Carton d'intro (optionnel) : texte affiché en carton plein avant la 1re séquence
accroche:
  texte: "Cette série a un énorme problème..."
  duree_s: 2.0

sequences:
  # rush : chemin vers le fichier vidéo brut (relatif à content-studio/, ou absolu)
  # debut_s/fin_s : découpe du rush (fin_s omis = jusqu'à la fin du fichier)
  # sous_titres : "auto" (transcription automatique) | "aucun" | chemin vers un .srt fourni
  # transition_sortie : transition vers la séquence suivante (sinon celle par
  #   défaut de la série est utilisée) : cut | fade | slide | zoom
  - rush: "rushs/diagnostic_exemple/clip1.mp4"
    debut_s: 0.0
    fin_s: 8.0
    sous_titres: auto
    transition_sortie: cut

  - rush: "rushs/diagnostic_exemple/clip2.mp4"
    debut_s: 2.0
    fin_s: 15.0
    sous_titres: auto
    overlay_texte:
      - texte: "⚠️ spoiler"
        debut_s: 3.0
        fin_s: 5.0
        position: haut_centre
    transition_sortie: fade

  - rush: "rushs/diagnostic_exemple/clip3.mp4"
    sous_titres: auto

# Audio de l'épisode (optionnel — sans ce bloc : musique piochée automatiquement
# selon `audio.mood_musique` de la série, et pas de sfx)
audio:
  musique: null    # ex: "sounds/music/energique_02.mp3" pour forcer une piste précise
  sfx:
    - id: whoosh_court
      au_temps_s: 8.0
