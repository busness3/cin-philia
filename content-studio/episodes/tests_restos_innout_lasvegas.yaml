# =============================================================================
# Tests Restos — In-N-Out Burger, Las Vegas
# Rush unique déjà cutée par Cléa, déposée sur rushs-a-monter (repo privé).
#
# v3 : vraie transcription (ElevenLabs Scribe, via le connecteur MCP —
# l'upload passe par googleapis.com, atteignable depuis cette session
# contrairement à huggingface.co/api.openai.com/api.elevenlabs.io en accès
# direct). Sous-titres découpés à partir du texte réel de Cléa
# (tests_restos_innout_lasvegas.srt), timecodes replacés à la main sur les
# plans du rush.
#
# v2 : plus de badges C'EST BEAU/BON/BOF (jugés inutiles par Cléa) -> retirés.
#
# v4 : carton titre d'ouverture animé (HyperFrames), retiré en v6.
#
# v6 : retour de Cléa (commentaire sur la page de suivi) —
# - plus de bandeau d'ouverture du tout (ni le clip animé, ni le sous-titre
#   "In-N-Out.") -> bloc `accroche` supprimé.
# - plus de bandeau de sortie sur CET épisode -> sortie_activee: false
#   (l'épisode passe outre le réglage global/série, qui restent inchangés
#   pour les futurs épisodes de la série).
# - sous-titres corrigés : timecodes, texte mal transcrit ("mon cousin a
#   pris le double" et non "donc du moins y'a pas le double"), une réplique
#   manquante ajoutée ("c'est pas grave"), deux répliques du passage friture
#   remplacées par ce que Cléa dit vraiment à 25s/30s.
# =============================================================================

serie: tests_restos
titre_episode: "In-N-Out Burger — Las Vegas"
sortie: out/tests_restos_innout_lasvegas.mp4
sortie_activee: false

sequences:
  - rush: "/home/user/rushs-a-monter/In out Las Vegas .mp4"
    debut_s: 0.0
    sous_titres: episodes/tests_restos_innout_lasvegas.srt

# Pas de musique par défaut sur cet épisode (rien demandé) — silence + son
# d'ambiance/réactions de Cléa seuls.
audio:
  musique: null
  mood_musique: null
  sfx: []
